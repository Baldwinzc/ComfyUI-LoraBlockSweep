[project]
name = "comfyui-lorablockweight"
description = "Per-block LoRA weighting for DiT models (FLUX.1, Qwen-Image, SD3.5 Large): scan every transformer block, sweep strengths, and render labeled comparison grids."
version = "2.2.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Baldwinzc", email = "1018067278@qq.com" },
]
keywords = ["comfyui", "lora", "flux", "flux.1", "qwen-image", "sd3", "sd3.5", "dit", "stable-diffusion", "image-generation", "ablation"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Baldwinzc/ComfyUI-LoraBlockWeight"
"Bug Tracker" = "https://github.com/Baldwinzc/ComfyUI-LoraBlockWeight/issues"

[tool.pytest.ini_options]
# Default (prepend) import mode: pytest walks up only through dirs that have
# __init__.py and stops at tests/ (which has none), so it never imports the
# repo-root __init__.py (ComfyUI's entry point, which uses a package-relative
# import). tests/conftest.py stubs the ComfyUI-only modules.
testpaths = ["tests"]

[tool.comfy]
PublisherId = "baldwinzc"
DisplayName = "ComfyUI-LoraBlockWeight"
Icon = ""
